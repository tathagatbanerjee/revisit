name: revisit
services:
  app:
    build: .
    ports:
      - "127.0.0.1:4320:4320"
    environment:
      HOST: 0.0.0.0
      PORT: 4320
      REVISIT_DATA: /data
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
    volumes:
      - revisit-data:/data
    init: true
    security_opt:
      - no-new-privileges:true
volumes:
  revisit-data:
